name: Unpack & Build SadNPCs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          if [ -f "sadnpcs-1.0.0-fabric-26.3.zip" ]; then
            unzip -o sadnpcs-1.0.0-fabric-26.3.zip
          else
            echo "Zip file not found, assuming files are already unpacked."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: sadnpcs-1.0.0-mc26.3
          path: build/libs/*.jar

name: Build sadNPCs

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 26.3 mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Locate and extract source archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE=$(find . -maxdepth 1 -type f -name 'sadNPCs-*-source.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No sadNPCs source archive found in repository root."
            echo "Expected a file matching sadNPCs-*-source.zip"
            exit 1
          fi

          mkdir -p .build-source
          unzip -q "$ARCHIVE" -d .build-source

          PROJECT_DIR=$(find .build-source -mindepth 1 -maxdepth 2 -type f -name 'build.gradle' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find build.gradle inside the archive."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Generate Gradle Wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.7.1
          fi
          chmod +x ./gradlew

      - name: Build mod
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sadNPCs-build
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
